name: Agent checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo build --locked
      - run: npm test
      - name: systemd and s6 service lifecycle
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y s6
          sudo sh tests/linux-services.test.sh
      - name: OpenRC supervision
        if: runner.os == 'Linux'
        run: |
          docker run --rm --init -v "$PWD:/src:ro" -w /src alpine:3.24 sh -ec '
            apk add --no-cache openrc
            mkdir -p /run/openrc
            touch /run/openrc/softlevel
            sh tests/openrc-supervision.test.sh
          '
